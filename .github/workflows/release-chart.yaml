name: Release Chart

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Signed chart tag to publish (for example v0.1.5)
        required: true
        type: string

jobs:
  validate:
    uses: ./.github/workflows/lint-test.yaml
    with:
      ref: ${{ inputs.release_tag }}

  release:
    if: github.repository == 'stellwerk-labs/platform-orchestrator-helm-chart'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout selected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5

      - name: Add NATS chart repository
        run: helm repo add nats https://nats-io.github.io/k8s/helm/charts/

      - name: Validate selected release tag and chart version
        id: chart
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          printf '%s\n' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          chart_version="$(awk '$1 == "version:" { print $2; exit }' charts/platform-orchestrator/Chart.yaml)"
          printf 'Selected tag: <%s>; chart version: <%s>\n' "$release_tag" "$chart_version"
          test "v$chart_version" = "$release_tag"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "chart_version=$chart_version" >> "$GITHUB_OUTPUT"

      - name: Lint and package chart
        run: |
          set -euo pipefail
          helm dependency build charts/platform-orchestrator
          helm lint charts/platform-orchestrator
          mkdir -p dist
          helm package charts/platform-orchestrator --destination dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish OCI chart and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chart="dist/platform-orchestrator-${{ steps.chart.outputs.chart_version }}.tgz"
          helm push "$chart" oci://ghcr.io/stellwerk-labs/charts
          notes="docs/releases/${{ steps.chart.outputs.release_tag }}.md"
          test -f "$notes"
          gh release create "${{ steps.chart.outputs.release_tag }}" "$chart" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "$notes"

      - name: Verify published chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.chart.outputs.release_tag }}
          CHART_VERSION: ${{ steps.chart.outputs.chart_version }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | grep -Fx "platform-orchestrator-${CHART_VERSION}.tgz"
          helm show chart oci://ghcr.io/stellwerk-labs/charts/platform-orchestrator \
            --version "$CHART_VERSION" | grep -Fx "version: ${CHART_VERSION}"
